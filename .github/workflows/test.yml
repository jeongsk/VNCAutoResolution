name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test
        run: swift test

      # 앱 번들이 universal로 만들어지는지 확인한다. CI에는 인증서가 없으므로 ad-hoc 서명.
      - name: Build app bundle
        run: SIGN_IDENTITY=- ./build.sh
